name: Publish to itch.io

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch-next-apex-html5
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish HTML5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the selected version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the game
        run: npm run build

      - name: Install official butler
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default \
            --output "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/itch-butler"
          chmod +x "$RUNNER_TEMP/itch-butler/butler"
          "$RUNNER_TEMP/itch-butler/butler" version
          echo "$RUNNER_TEMP/itch-butler" >> "$GITHUB_PATH"

      - name: Publish the HTML5 channel
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          GAME_VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo '::error::Add the BUTLER_API_KEY repository secret before publishing.'
            exit 1
          fi
          test -f dist/index.html
          butler push dist ichi-nya/next-apex:html5 --userversion "$GAME_VERSION"
